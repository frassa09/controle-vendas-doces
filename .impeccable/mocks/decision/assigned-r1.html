<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Balcão de Padaria</title>
<style>
  :root{--loja:#D6336C;--loja-esc:#A11F52;--feltro:#1C1C1C;--branco:#FFFFFF;--vidro:#CFE6E3;--inox:#B9C2C4;--brownie:#4A2616;--brownie-top:#6E3B22}
  *{box-sizing:border-box;margin:0}
  body{width:390px;height:844px;overflow:hidden;font-family:system-ui,Roboto,sans-serif;background:#F4F6F6;color:var(--feltro)}
  .toldo{height:92px;background:repeating-linear-gradient(90deg,var(--loja) 0 39px,var(--branco) 39px 78px);position:relative}
  .toldo::after{content:"";position:absolute;left:0;right:0;bottom:-19px;height:20px;
    background:radial-gradient(circle at 19.5px 0,var(--loja) 19px,transparent 19.5px) 0 0/78px 20px,
               radial-gradient(circle at 58.5px 0,var(--branco) 19px,transparent 19.5px) 0 0/78px 20px}
  .feltro{background:var(--feltro);color:#fff;
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 9px);
    font:700 20px/1.15 "Arial Narrow",Arial,sans-serif;letter-spacing:2.5px;text-transform:uppercase;border:5px solid #8A6A4A;border-radius:6px}
  .placa{margin:34px 30px 0;padding:12px 10px;text-align:center;font-size:26px}
  .ola{text-align:center;margin-top:12px;font-size:16px;font-weight:600}
  .vitrine{margin:16px 16px 0;position:relative;border-radius:26px 26px 6px 6px;padding:16px 14px 10px;
    background:linear-gradient(180deg,rgba(207,230,227,.95),rgba(207,230,227,.6));border:3px solid var(--inox);overflow:hidden}
  .vitrine::before{content:"";position:absolute;top:-40px;left:40px;width:46px;height:340px;background:rgba(255,255,255,.55);transform:rotate(28deg)}
  .vitrine::after{content:"";position:absolute;top:-40px;left:110px;width:12px;height:340px;background:rgba(255,255,255,.5);transform:rotate(28deg)}
  .prat{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-bottom:8px;border-bottom:5px solid var(--inox);margin-bottom:14px;position:relative;z-index:1}
  .prat:last-child{margin-bottom:0}
  .slot{height:58px;display:flex;align-items:flex-end;justify-content:center}
  .bw{width:46px;height:34px;border-radius:5px;background:var(--brownie);position:relative;box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .bw::before{content:"";position:absolute;inset:0 0 18px 0;border-radius:5px 5px 2px 2px;background:var(--brownie-top);
    clip-path:polygon(0 0,100% 0,100% 80%,78% 100%,60% 70%,40% 100%,20% 75%,0 100%)}
  .tag{width:42px;height:28px;border:2px dashed var(--loja-esc);border-radius:4px;background:rgba(255,255,255,.7);
    display:grid;place-items:center;font-weight:800;color:var(--loja-esc);font-size:16px}
  .contador{margin:14px 16px 0;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:18px}
  .contador b{font-size:34px;letter-spacing:1px}
  .acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 16px 0}
  .btn{border-radius:14px;padding:13px 10px;text-align:center;font-weight:800;font-size:15px;line-height:1.25;text-transform:uppercase;letter-spacing:.5px}
  .btn small{display:block;font-weight:600;text-transform:none;letter-spacing:0;font-size:13px;opacity:.85}
  .b1{background:var(--feltro);color:#fff}.b2{background:var(--loja);color:#fff}
  .divida{margin:12px 16px 0;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:16px}
  .divida span{background:#fff;color:var(--feltro);border-radius:8px;padding:6px 10px;font-size:13px;letter-spacing:1px}
</style></head><body>
<div class="toldo"></div>
<div class="placa feltro">Doces da Ana</div>
<p class="ola">Oi, Júlia! Olha sua vitrine:</p>
<div class="vitrine">
  <div class="prat"><div class="slot"><div class="bw"></div></div><div class="slot"><div class="bw"></div></div><div class="slot"><div class="bw"></div></div><div class="slot"><div class="bw"></div></div><div class="slot"><div class="bw"></div></div></div>
  <div class="prat"><div class="slot"><div class="bw"></div></div><div class="slot"><div class="bw"></div></div><div class="slot"><div class="tag">?</div></div><div class="slot"><div class="tag">?</div></div><div class="slot"><div class="tag">?</div></div></div>
</div>
<div class="contador feltro"><b>7 de 10</b><span>faltam 3 pro<br>doce grátis</span></div>
<div class="acoes">
  <div class="btn b1">Trocar<small>por um doce · 10 pts</small></div>
  <div class="btn b2">Raspar o vidro<small>tentar a sorte · 5 pts</small></div>
</div>
<div class="divida feltro">Em aberto R$ 18,00<span>COPIAR PIX</span></div>
</body></html>
