<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Padrão</title>
<style>
  :root{--loja:#D6336C;--tinta:#1F1F1F;--cinza:#6B6B6B;--linha:#ECECEC}
  *{box-sizing:border-box;margin:0}
  body{width:390px;height:844px;overflow:hidden;font-family:system-ui,Roboto,sans-serif;color:var(--tinta);background:#fff}
  header{padding:24px 20px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--linha)}
  .logo{width:40px;height:40px;border-radius:12px;background:var(--loja)}
  header h1{font-size:18px}header p{font-size:13px;color:var(--cinza)}
  .saldo{padding:28px 20px 8px}
  .saldo p{color:var(--cinza);font-size:14px}.saldo b{font-size:52px;display:block;margin-top:4px}
  .card{margin:16px 20px 0;border:1px solid var(--linha);border-radius:16px;padding:18px}
  .card h2{font-size:15px;margin-bottom:14px}
  .grade{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .grade i{aspect-ratio:1;border-radius:50%;background:var(--loja)}
  .grade i.o{background:none;border:2px dashed #D0D0D0}
  .card .nota{font-size:13px;color:var(--cinza);margin-top:12px}
  .acoes{display:grid;gap:10px;margin:18px 20px 0}
  .btn{border-radius:12px;padding:15px;text-align:center;font-weight:600}
  .b1{background:var(--loja);color:#fff}.b2{background:#F5F5F5}
  .divida{display:flex;justify-content:space-between;align-items:center}
  .divida b{font-size:22px}.divida span{color:var(--loja);font-weight:600}
</style></head><body>
<header><div class="logo"></div><div><h1>Doces da Ana</h1><p>Olá, Júlia</p></div></header>
<div class="saldo"><p>Seus pontos</p><b>7</b></div>
<div class="card"><h2>Cartela de fidelidade</h2>
  <div class="grade"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i></div>
  <p class="nota">Faltam 3 pontos para um doce grátis</p></div>
<div class="acoes"><div class="btn b1">Trocar por um doce (10 pts)</div><div class="btn b2">Raspadinha (5 pts)</div></div>
<div class="card divida"><div><p style="font-size:13px;color:#6B6B6B">Em aberto</p><b>R$ 18,00</b></div><span>Copiar Pix</span></div>
</body></html>
